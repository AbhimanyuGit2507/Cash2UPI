subprojects {
    // Inject mock flutter property for plugins that evaluate too early or miss it
    if (project.name != 'app' && !project.hasProperty('flutter')) {
        project.ext.flutter = [
            compileSdkVersion: 34,
            minSdkVersion: 24,
            targetSdkVersion: 34,
            ndkVersion: "25.1.8937393"
        ]
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
    }
}
